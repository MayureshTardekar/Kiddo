name: child_app
description: A polished kids learning game app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  audioplayers: ^5.2.1
  confetti: ^0.7.0
  lottie: ^3.1.2
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/
    - assets/images/
    - assets/characters/
    - assets/badges/
